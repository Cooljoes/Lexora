name: Lexora
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.2.2
    CODE_SIGN_STYLE: Automatic
    LEXORA_BUNDLE_ID: studio.lexora.reader
    LEXORA_APP_GROUP: "group.$(LEXORA_BUNDLE_ID)"
    LEXORA_CLOUD_CONTAINER: "iCloud.$(LEXORA_BUNDLE_ID)"
    SUPPORTS_MACCATALYST: NO
targets:
  Lexora:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Shared
      - Resources
      - path: KokoroVoicePack
        type: folder
        buildPhase: resources
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Lexora
        LexoraAppGroup: "$(LEXORA_APP_GROUP)"
        LexoraCloudContainer: "$(LEXORA_CLOUD_CONTAINER)"
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Lexora.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "$(LEXORA_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
          INFOPLIST_FILE: Config/App-Local-Info.plist
    dependencies:
      - target: LexoraShare
        embed: true
      - sdk: libsqlite3.tbd
  LexoraShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: 存入 Lexora
        LexoraAppGroup: "$(LEXORA_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Config/Share.entitlements
      properties:
        com.apple.security.application-groups: ["$(LEXORA_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LEXORA_BUNDLE_ID).share"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LexoraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.lexora.tests
    dependencies:
      - target: Lexora
  LexoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.lexora.uitests
        TEST_TARGET_NAME: Lexora
    dependencies:
      - target: Lexora
schemes:
  Lexora:
    build:
      targets:
        Lexora: all
    test:
      targets: [LexoraTests, LexoraUITests]
